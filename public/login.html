<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sign in · Grimoire</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='2' fill='%23151617'/><rect x='8' y='5' width='17' height='22' rx='1.5' fill='%231d1e21' stroke='%23f26b1d' stroke-width='2'/><path d='M11.6 5.8v20.4' stroke='%23f26b1d' stroke-width='1.6' opacity='.75'/><path d='M18.6 11.4l3.4 4.6-3.4 4.6-3.4-4.6z' fill='%23f26b1d'/></svg>">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#151617">
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="auth">

<div class="auth-card" role="main">
  <h1 class="sr-only">Sign in to Grimoire</h1>
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" role="img" aria-label="Grimoire" style="width:34px;height:34px">
      <rect x="9" y="5" width="18" height="22" rx="1" fill="#d9d7cf"/>
      <rect x="5.5" y="4" width="19" height="24" rx="1.5" fill="#1d1e21" stroke="#f26b1d" stroke-width="1.5"/>
      <path d="M10.2 4.9v22.2" stroke="#f26b1d" stroke-width="1.2" opacity=".75"/>
      <path d="M17.4 11.2 20.8 16l-3.4 4.8L14 16z" fill="#f26b1d"/>
      <path d="M17.4 22.7v1.6" stroke="#f26b1d" stroke-width="1.2" opacity=".8"/>
    </svg>
    Grimoire
  </div>
  <div class="tag" id="tag">Card inventory, storage and price history for your Magic: The Gathering collection.</div>
  <!-- #238: right under the explanation, so a phone shows it without
       scrolling past the whole sign-up form. -->
  <div class="switch request-row" id="requestRow" hidden>
    <span id="requestText"></span>
    <button type="button" id="requestBtn"></button>
  </div>

  <form id="form" autocomplete="on">
    <label id="usernameWrap">Username <input id="username" autocomplete="username" autocapitalize="none" spellcheck="false" aria-describedby="usernameHint">
      <span class="hint field-hint" id="usernameHint" hidden>3-32 characters: letters, numbers, dot, dash or underscore, starting with a letter or number.</span></label>
    <label id="displayWrap" hidden>Display name (optional) <input id="displayName" autocomplete="nickname"></label>
    <label id="reqNameWrap" hidden>Your name <input id="reqName" autocomplete="name" maxlength="80"></label>
    <label id="emailWrap" hidden><span id="emailLabel">Email</span> <input id="email" type="email" autocomplete="email" spellcheck="false"></label>
    <label id="reqNoteWrap" hidden>Anything you'd like to add? (optional)
      <textarea id="reqNote" rows="3" maxlength="500" placeholder="How you heard about Grimoire, or what you'd use it for"></textarea></label>
    <!-- Honeypot (#238): off-screen and skipped by keyboard and screen
         readers; only a form-filling bot puts anything in it. -->
    <div class="hp" aria-hidden="true"><label>Website <input id="website" tabindex="-1" autocomplete="off"></label></div>
    <label id="passwordWrap">Password <input id="password" type="password" autocomplete="current-password" aria-describedby="passwordHint">
      <span class="hint field-hint" id="passwordHint" hidden>At least 10 characters, with at least one letter and one number.</span></label>
    <label id="codeWrap" hidden>Authenticator code <input id="code" inputmode="numeric" autocomplete="one-time-code" spellcheck="false" placeholder="6-digit code, or a recovery code"></label>
    <label id="password2Wrap" hidden>Repeat password <input id="password2" type="password" autocomplete="new-password"></label>
    <label id="inviteWrap" hidden>Invite code <input id="invite" autocomplete="off" spellcheck="false"></label>
    <label id="digestWrap" class="row" hidden style="margin-bottom:13px"><input type="checkbox" id="digestOptIn">
      Email me a daily digest - what I did, what moved, and what's new in Grimoire</label>
    <div class="modal-actions">
      <button type="submit" id="submit" class="primary" style="flex:1;justify-content:center">Sign in</button>
    </div>
  </form>

  <div id="msg" class="status" role="status" aria-live="polite"></div>
  <div class="switch" id="forgotRow">
    <button type="button" id="forgotBtn" class="ghost small">Forgot password?</button>
  </div>
  <div class="switch">
    <span id="switchText"></span>
    <button type="button" id="switchBtn"></button>
  </div>
  <div class="switch home-link"><a href="/welcome.html">What is Grimoire?</a></div>
</div>

<script src="/login.page.js"></script>
</body>
</html>
