<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sealed Inventory · Grimoire</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='2' fill='%23151617'/><rect x='8' y='5' width='17' height='22' rx='1.5' fill='%231d1e21' stroke='%23f26b1d' stroke-width='2'/><path d='M11.6 5.8v20.4' stroke='%23f26b1d' stroke-width='1.6' opacity='.75'/><path d='M18.6 11.4l3.4 4.6-3.4 4.6-3.4-4.6z' fill='%23f26b1d'/></svg>">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#151617">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<main>
  <h1>Sealed Inventory <a class="help-link" href="/help.html#sealed" title="Help for this page" aria-label="Help for this page"><svg class=ic aria-hidden=true><use href=/icons/sprite.svg#circle-help></use></svg></a></h1>
  <p class="page-intro">Sealed product on hand. Add more from <a href="/receive.html?item=sealed">Receive</a>.</p>

  <section class="tight">
    <div class="toolbar">
      <input id="search" class="grow" placeholder="Search name or set…">
      <select id="filterLoc" aria-label="Filter by location"></select>
      <button id="btnClear" class="ghost">Clear</button>
      <button id="btnRefresh" class="primary" title="Re-pull each product's current market price from Manapool's sealed catalog"><svg class=ic aria-hidden=true><use href=/icons/sprite.svg#refresh-cw></use></svg> Refresh prices</button>
    </div>
  </section>

  <section class="summary" id="summary"></section>

  <div class="table-wrap" id="sealedWrap">
    <!-- Static table, only the tbody is redrawn: the generic column sort keys
         its saved state on the <table> element, so rebuilding the whole table
         on every edit would reset the user's sort. -->
    <table class="list" data-sort id="sealedTable" hidden>
      <thead><tr>
        <th>Name</th><th class="hide-sm">Set</th><th class="num">Have</th><th>Location</th>
        <th class="num hide-sm">Market</th><th class="num hide-sm">Cost ea.</th><th class="num">Listed</th><th class="num hide-sm">Ask</th><th></th>
      </tr></thead>
      <tbody id="sealedBody"></tbody>
    </table>
    <div id="sealedEmpty" hidden></div>
  </div>
</main>

<script src="/js/shipCost.js"></script>
<script src="/js/priceRuleEngine.js"></script>
<script src="/js/core.js"></script>
<script src="/js/glossary.js"></script>
<script src="/js/ui.js"></script>
<script src="/sealed.page.js"></script>
</body>
</html>
